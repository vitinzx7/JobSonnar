spring.application.name=JobSonnar
server.port=${SERVER_PORT:8080}
jooble.api.key=${JOOBLE_API_KEY:}
adzuna.app.id=${ADZUNA_APP_ID:}
adzuna.app.key=${ADZUNA_APP_KEY:}
openwebninja.api.key=${OPENWEBNINJA_API_KEY:}
theirstack.api.key=${THIRESTACK_API_KEY:}
serper.api.key=${SERPER_API_KEY:}
search.cache.ttl-seconds=120

# H2 persists across restarts; set DATABASE_URL/USER/PASSWORD to use PostgreSQL.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/jobsonnar;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.config.import=optional:file:./application-monitor.yml
monitor.enabled=${MONITOR_ENABLED:true}
monitor.interval-ms=${MONITOR_INTERVAL_MS:3600000}
monitor.email.enabled=${ALERT_EMAIL_ENABLED:false}
monitor.email.host=${ALERT_EMAIL_HOST:}
monitor.email.username=${ALERT_EMAIL_USERNAME:}
monitor.email.password=${ALERT_EMAIL_PASSWORD:}
monitor.email.folder=${ALERT_EMAIL_FOLDER:JobSonnar}
# Limit writes to a local browser by default. Required token when deploying remotely.
monitor.api-token=${MONITOR_API_TOKEN:}
